name: Publish game website

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site-content/state.json'
      - 'site-content/uploads/**'
      - '**.md'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:pages
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
